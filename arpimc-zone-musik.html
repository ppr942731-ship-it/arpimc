.theme-neo .arpimc-admin-shell .bg-black\/50,.theme-neo .arpimc-admin-shell [class*="bg-[#111]"]{background:#fff!important;border-color:#000!important}
.theme-skeuo .arpimc-admin-shell .bg-black\/50,.theme-skeuo .arpimc-admin-shell [class*="bg-[#111]"]{background:#efe2ce!important}
.theme-colorful .arpimc-admin-shell .bg-black\/50,.theme-colorful .arpimc-admin-shell [class*="bg-[#111]"]{background:#fff!important}

/* Keep buttons with semantic colors readable across themes. */
.theme-light .arpimc-admin-shell [class*="bg-[#00FF88]"],.theme-skeuo .arpimc-admin-shell [class*="bg-[#00FF88]"],.theme-colorful .arpimc-admin-shell [class*="bg-[#00FF88]"]{color:#06150d!important}
.theme-neo .arpimc-admin-shell [class*="bg-[#00FF88]"]{background:#00d878!important;color:#000!important}

/* Card contrast and slightly calmer motion */
.cylinder-card{transition:box-shadow .14s ease,border-color .14s ease!important;transform:none!important}
.cylinder-card:hover{transform:none!important;filter:none!important}
.arpimc-join-card,.arpimc-join-overlay{animation:none!important}
@media (prefers-reduced-motion:reduce){.arpimc-join-card,.arpimc-join-overlay{animation:none!important}}
</style>

<style id="arpimc-zone-final-revision3">
/* Revision 3: channel avatar + proportional mobile skin cards */
@media (max-width:640px){
  .cylinder{gap:12px!important;}
  .cylinder-card{flex-basis:calc((100% - 12px)/2)!important;width:calc((100% - 12px)/2)!important;}
  .cylinder-card .relative.mx-2{height:auto!important;aspect-ratio:3/4!important;min-height:0!important;}
  .cylinder-card .relative.mx-2 img{height:100%!important;width:100%!important;object-fit:cover!important;}
}
</style>

<script>
(function(){
  const ICON='https://files.catbox.moe/dbt47r.png';
  const MUSIC_KEY='arpimc_music_settings';
  const PLAYLIST_KEY='arpimc_music_playlist';
  const FAV_KEY='arpimc_music_favorites';
  const INDEX_KEY='arpimc_music_index';
  const DB_NAME='arpimc_zone_v7pro_media';
  let deferredPrompt=null,currentObjectUrl=null,playlist=[],currentIndex=0,shuffle=false;
  const fab=document.getElementById('arpimc-music-fab'),panel=document.getElementById('arpimc-music-panel'),audio=document.getElementById('arpimc-music-audio');
  const nameEl=document.getElementById('arpimc-mp-name');
  const listSec=document.getElementById('arpimc-mp-list-section'),favSec=document.getElementById('arpimc-mp-fav-section');
  const installModal=document.getElementById('arpimc-install-modal');
  function jsonGet(k,f){try{const v=JSON.parse(localStorage.getItem(k)||'');return v==null?f:v}catch{return f}}
  function jsonSet(k,v){localStorage.setItem(k,JSON.stringify(v))}
  function settings(){return jsonGet(MUSIC_KEY,{enabled:false})}
  function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,2);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('music'))db.createObjectStore('music');if(!db.objectStoreNames.contains('tracks'))db.createObjectStore('tracks')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
  async function putBlob(id,blob){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('tracks','readwrite');tx.objectStore('tracks').put(blob,id);tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error)})}
  async function getBlob(id){try{const db=await openDB();return await new Promise((res,rej)=>{const q=db.transaction('tracks','readonly').objectStore('tracks').get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}catch{return null}}
  async function deleteBlob(id){try{const db=await openDB();db.transaction('tracks','readwrite').objectStore('tracks').delete(id)}catch{}}
  function ensureMigration(){
    let p=jsonGet(PLAYLIST_KEY,null);
    if(!Array.isArray(p))p=[];
    const legacy=jsonGet(MUSIC_KEY,{});
    if(!p.length&&legacy&&legacy.url){p=[{id:'legacy-url',name:legacy.name||'ArpiMC Music',type:'url',url:legacy.url,createdAt:Date.now()}];jsonSet(PLAYLIST_KEY,p)}
    if(!p.length&&legacy&&legacy.type==='file'){p=[{id:'legacy-file',name:legacy.name||'Musik lokal',type:'file',createdAt:Date.now()}];jsonSet(PLAYLIST_KEY,p)}
    playlist=p;
    const n=Number(localStorage.getItem(INDEX_KEY));currentIndex=Number.isFinite(n)&&n>=0?n:0;
    if(currentIndex>=playlist.length)currentIndex=0;
  }
  function favorites(){return new Set(jsonGet(FAV_KEY,[]))}
  function current(){return playlist[currentIndex]||null}
  function isFav(id){return favorites().has(id)}
  function saveFavorites(set){jsonSet(FAV_KEY,[...set])}
  function syncEnabled(){const c=settings();c.enabled=playlist.length>0?c.enabled!==false:false;jsonSet(MUSIC_KEY,c)}
  async function loadTrack(track,autoplay){
    if(currentObjectUrl){URL.revokeObjectURL(currentObjectUrl);currentObjectUrl=null}
    if(!track){audio.removeAttribute('src');audio.load();nameEl.textContent='Belum ada lagu';renderPlayer();return}
    if(track.type==='file'){const b=await getBlob(track.id);if(!b){nameEl.textContent='File lagu tidak ditemukan';return}currentObjectUrl=URL.createObjectURL(b);audio.src=currentObjectUrl}
    else audio.src=track.url||'';
    audio.load();nameEl.textContent=track.name||'ArpiMC Music';localStorage.setItem(INDEX_KEY,String(currentIndex));renderPlayer();
    if(autoplay){try{await audio.play()}catch{}}
  }
  async function refreshPlayer(autoplay=false){ensureMigration();const c=settings();if(!c.enabled||!playlist.length){audio.pause();audio.removeAttribute('src');audio.load();nameEl.textContent='Musik dimatikan / belum ada lagu';renderPlayer();return}await loadTrack(current(),autoplay)}
  function renderList(container,items,empty){
    container.innerHTML='';
    if(!items.length){container.innerHTML='<div style="font-size:11px;opacity:.5;padding:7px 0">'+empty+'</div>';return}
    items.forEach(t=>{const idx=playlist.findIndex(x=>x.id===t.id);const row=document.createElement('div');row.className='mp-track'+(idx===currentIndex?' current':'');row.innerHTML='<button data-play-id="'+t.id+'">▶</button><div class="mp-track-name">'+escapeHtml(t.name||'Tanpa nama')+'</div><button class="mp-star '+(isFav(t.id)?'active':'')+'" data-fav-id="'+t.id+'">'+(isFav(t.id)?'★':'☆')+'</button>';container.appendChild(row)})
  }
  function renderPlayer(){
    const c=current();nameEl.textContent=c?(c.name||'ArpiMC Music'):(settings().enabled?'Belum ada lagu':'Musik dimatikan / belum ada lagu');
    document.getElementById('arpimc-mp-play').textContent=audio.paused?'▶ Play':'⏸ Pause';
    document.getElementById('arpimc-mp-shuffle').classList.toggle('active',shuffle);
    document.getElementById('arpimc-mp-fav').classList.toggle('active',!!c&&isFav(c.id));
    renderList(document.getElementById('arpimc-mp-tracks'),playlist,'Belum ada lagu di daftar.');
    renderList(document.getElementById('arpimc-mp-favs'),playlist.filter(x=>isFav(x.id)),'Belum ada lagu favorit.');
  }
  function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  async function nextTrack(){if(!playlist.length)return;let next;if(shuffle){const choices=playlist.map((_,i)=>i).filter(i=>playlist.length<2||i!==currentIndex);next=choices[Math.floor(Math.random()*choices.length)]}else next=(currentIndex+1)%playlist.length;currentIndex=next;await loadTrack(current(),true)}
  document.getElementById('arpimc-mp-close').onclick=()=>panel.classList.remove('open');
  document.getElementById('arpimc-mp-play').onclick=async()=>{if(!current()){await refreshPlayer(true);return}if(audio.paused){try{await audio.play()}catch{}}else audio.pause();renderPlayer()};
  document.getElementById('arpimc-mp-shuffle').onclick=()=>{shuffle=!shuffle;renderPlayer()};
  document.getElementById('arpimc-mp-list').onclick=()=>{listSec.style.display=listSec.style.display==='none'?'block':'none'};
  document.getElementById('arpimc-mp-fav').onclick=()=>{const c=current();if(!c)return;const set=favorites();set.has(c.id)?set.delete(c.id):set.add(c.id);saveFavorites(set);renderPlayer()};
  document.getElementById('arpimc-mp-tracks').onclick=async e=>{const b=e.target.closest('[data-play-id]');const f=e.target.closest('[data-fav-id]');if(b){const id=b.dataset.playId;currentIndex=playlist.findIndex(x=>x.id===id);await loadTrack(current(),true)}else if(f){const set=favorites(),id=f.dataset.favId;set.has(id)?set.delete(id):set.add(id);saveFavorites(set);renderPlayer()}};
  document.getElementById('arpimc-mp-favs').onclick=document.getElementById('arpimc-mp-tracks').onclick;
  favSec.addEventListener('click',()=>{});
  audio.addEventListener('play',renderPlayer);audio.addEventListener('pause',renderPlayer);audio.addEventListener('ended',nextTrack);audio.addEventListener('error',()=>{nameEl.textContent='Lagu gagal dimuat';renderPlayer()});

  // Drag the music circle around the screen. A tap without movement opens/closes the player.
  function makeDraggable(el,clickFn){let sx=0,sy=0,ox=0,oy=0,moved=false,dragging=false;el.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;const r=el.getBoundingClientRect();ox=r.left;oy=r.top;moved=false;dragging=true;el.classList.add('dragging');el.setPointerCapture?.(e.pointerId)});el.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>8)moved=true;const nx=Math.max(4,Math.min(window.innerWidth-el.offsetWidth-4,ox+dx));const ny=Math.max(4,Math.min(window.innerHeight-el.offsetHeight-4,oy+dy));el.style.left=nx+'px';el.style.top=ny+'px';el.style.right='auto';el.style.bottom='auto'});el.addEventListener('pointerup',e=>{dragging=false;el.classList.remove('dragging');if(!moved)clickFn(e)})}
  makeDraggable(fab,()=>panel.classList.toggle('open'));

  // Install / normal shortcut choices. The button lives beside the hamburger menu.
  const installFab=document.getElementById('arpimc-install-fab');
  installFab.onclick=()=>installModal.classList.add('open');
  function placeInstallButton(){
    if(!installFab)return;
    const buttons=[...document.querySelectorAll('header button')];
    const menuBtn=buttons.find(b=>b.querySelectorAll('span').length===3 && b.getBoundingClientRect().width>=40);
    if(!menuBtn)return;
    const r=menuBtn.getBoundingClientRect();
    const gap=6;
    const left=Math.max(4,r.left-installFab.offsetWidth-gap);
    installFab.style.left=left+'px';
    installFab.style.top=Math.max(4,r.top+1)+'px';
    installFab.style.right='auto';
    installFab.style.bottom='auto';
    installFab.style.display='flex';
  }
  window.addEventListener('resize',placeInstallButton);
  window.addEventListener('scroll',placeInstallButton,{passive:true});
  const installObserver=new MutationObserver(()=>requestAnimationFrame(placeInstallButton));
  installObserver.observe(document.getElementById('root'),{childList:true,subtree:true});
  setTimeout(placeInstallButton,300);
  document.getElementById('arpimc-install-close').onclick=()=>installModal.classList.remove('open');
  installModal.addEventListener('click',e=>{if(e.target===installModal)installModal.classList.remove('open')});
  document.getElementById('arpimc-shortcut-normal').onclick=()=>{alert('Pintasan biasa tidak bisa dipaksa oleh website. Di Chrome Android: buka menu ⋮ → “Tambahkan ke layar utama” / “Buat pintasan”. Ikonnya memakai favicon ArpiMC Zone.')};
  document.getElementById('arpimc-install-pwa').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch{}deferredPrompt=null;installModal.classList.remove('open');return}alert('PWA belum menawarkan tombol instal otomatis di browser ini. Gunakan menu browser → “Instal aplikasi” atau “Tambahkan ke layar utama”.')};
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});window.addEventListener('appinstalled',()=>{deferredPrompt=null;installModal.classList.remove('open')});
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));

  // Admin music settings live inside a React-owned placeholder. We never inject into React's existing nodes.
  function renderAdminMusic(){
    const host=document.getElementById('arpimc-music-admin-root');if(!host)return false;if(host.dataset.ready==='1')return true;
    ensureMigration();
    const c=settings();
    host.innerHTML='<div style="font-weight:800;font-size:14px">🎵 Pengaturan Musik Website</div><div style="font-size:11px;opacity:.7;margin-top:3px">Admin saja. Pengunjung melihat ikon 🎵 yang bisa digeser dan dibuka.</div><label style="display:flex;align-items:center;gap:8px;margin-top:11px;font-size:12px;font-weight:700"><input id="arpimc-music-enabled" type="checkbox" '+(c.enabled?'checked':'')+'> Aktifkan musik</label><div style="margin-top:11px;font-size:11px;font-weight:800">Tambah lagu dari link Catbox / MP3 / OGG</div><div class="music-admin-row"><input id="arpimc-music-url" type="url" placeholder="https://files.catbox.moe/contoh.mp3" style="flex:1;min-width:180px;height:40px;border-radius:9px;border:1px solid rgba(0,0,0,.2);padding:0 10px;background:#fff;color:#111;font-size:12px"><button class="primary" id="arpimc-music-add-url">＋ Tambah Link</button><label style="border-radius:9px;padding:9px 11px;font-weight:800;font-size:11px;cursor:pointer;background:#111;color:#fff"><input id="arpimc-music-file" type="file" accept="audio/*" style="display:none">📁 Tambah dari HP</label></div><div class="music-admin-list" id="arpimc-music-admin-list"></div><div class="music-admin-row"><button class="music-admin-danger" id="arpimc-music-clear">🗑 Hapus Semua Lagu</button></div><small>Maksimal file lokal 15 MB per lagu. Link harus langsung ke file audio. Browser tetap membutuhkan sentuhan pengguna untuk memulai suara.</small>';
    const list=host.querySelector('#arpimc-music-admin-list');
    if(!playlist.length)list.innerHTML='<div style="font-size:11px;opacity:.5">Belum ada lagu.</div>';else playlist.forEach((t,i)=>{const row=document.createElement('div');row.className='music-admin-item';row.innerHTML='<span class="name">'+(i+1)+'. '+escapeHtml(t.name||'Tanpa nama')+'</span><button data-admin-play="'+t.id+'">▶</button><button class="music-admin-danger" data-admin-remove="'+t.id+'">Hapus</button>';list.appendChild(row)});
    host.dataset.ready='1';
    return true;
  }
  const adminTimer=setInterval(()=>{renderAdminMusic(false)},500);
  document.addEventListener('change',async e=>{
    if(e.target.id==='arpimc-music-enabled'){const c=settings();c.enabled=e.target.checked&&playlist.length>0;jsonSet(MUSIC_KEY,c);await refreshPlayer(false);return}
    if(e.target.id==='arpimc-music-file'){const f=e.target.files&&e.target.files[0];if(!f)return;if(!f.type.startsWith('audio/')){alert('Pilih file audio.');e.target.value='';return}if(f.size>15*1024*1024){alert('File terlalu besar. Maksimal 15 MB per lagu.');e.target.value='';return}const id='track-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);await putBlob(id,f);playlist.push({id,name:f.name,type:'file',createdAt:Date.now()});jsonSet(PLAYLIST_KEY,playlist);const c=settings();c.enabled=true;jsonSet(MUSIC_KEY,c);renderAdminMusic(true);await refreshPlayer(false);alert('🎵 Lagu dari HP ditambahkan.');return}
  });
  document.addEventListener('click',async e=>{
    const add=e.target.closest('#arpimc-music-add-url');if(add){const host=document.getElementById('arpimc-music-admin-root'),inp=host?.querySelector('#arpimc-music-url'),url=inp?.value.trim()||'';if(!/^https?:\/\//i.test(url)){alert('Masukkan link HTTPS/HTTP langsung ke file audio.');return}const id='track-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);playlist.push({id,name:url.split('/').pop().split('?')[0]||'ArpiMC Music',type:'url',url,createdAt:Date.now()});jsonSet(PLAYLIST_KEY,playlist);const c=settings();c.enabled=true;jsonSet(MUSIC_KEY,c);renderAdminMusic(true);await refreshPlayer(false);inp.value='';alert('🎵 Link lagu ditambahkan.');return}
    const rm=e.target.closest('[data-admin-remove]');if(rm){const id=rm.dataset.adminRemove;playlist=playlist.filter(x=>x.id!==id);jsonSet(PLAYLIST_KEY,playlist);await deleteBlob(id);if(currentIndex>=playlist.length)currentIndex=0;jsonSet(INDEX_KEY,currentIndex);const c=settings();c.enabled=playlist.length>0&&c.enabled!==false;jsonSet(MUSIC_KEY,c);renderAdminMusic(true);await refreshPlayer(false);return}
    const ap=e.target.closest('[data-admin-play]');if(ap){const id=ap.dataset.adminPlay;currentIndex=playlist.findIndex(x=>x.id===id);await refreshPlayer(true);return}
    if(e.target.closest('#arpimc-music-clear')){for(const t of playlist)if(t.type==='file')await deleteBlob(t.id);playlist=[];jsonSet(PLAYLIST_KEY,[]);jsonSet(MUSIC_KEY,{enabled:false});currentIndex=0;renderAdminMusic(true);await refreshPlayer(false);return}
  });
  window.addEventListener('storage',e=>{if([MUSIC_KEY,PLAYLIST_KEY,FAV_KEY].includes(e.key)){ensureMigration();renderPlayer();renderAdminMusic();refreshPlayer(false)}});
  ensureMigration();renderPlayer();refreshPlayer(false);
})();
</script>
</body>

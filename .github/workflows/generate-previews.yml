name: Generate social previews
on:
  push:
    branches: [main]
    paths:
      - 'skins.json'
      - 'addons.json'
      - 'games.json'
      - 'generate-previews.py'
      - '.github/workflows/generate-previews.yml'
permissions:
  contents: write
concurrency:
  group: social-preview-generator
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate or update preview pages
        run: python generate-previews.py
      - name: Commit generated previews when changed
        run: |
          if [[ -n "$(git status --porcelain share/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add share/
            git commit -m "Auto-update social preview pages"
            git push
          else
            echo "Preview pages are already up to date."
          fi
